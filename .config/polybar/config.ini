[colors]
background = #222222
foreground = #bbbbbb
primary    = #005577
alert      = #770000
dim        = #444444

[bar/main]
monitor  = ${env:MONITOR:}
width    = 100%
height   = 27
radius   = 0

background = ${colors.background}
foreground = ${colors.foreground}

border-size   = 0
padding-left  = 1
padding-right = 1
module-margin = 1

font-0 = Noto Sans Mono:size=13;2
font-1 = Iosevka Nerd Font Mono:size=16;3

modules-left   = i3 xwindow
modules-center =
modules-right  = volume battery date

separator =

wm-restack   = i3
cursor-click = pointer

enable-ipc = true

tray-position = right
tray-padding  = 4

[module/i3]
type = internal/i3

; only show workspaces that live on the same monitor as this bar
pin-workspaces = true
; keep them ordered by workspace number
index-sort = true

label-focused            = %index%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.primary}
label-focused-padding    = 1

label-unfocused         = %index%
label-unfocused-padding = 1

label-urgent            = %index%
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.alert}
label-urgent-padding    = 1

label-visible         = %index%
label-visible-padding = 1

[module/xwindow]
type  = internal/xwindow
label = %title:0:60:...%

[module/mpd]
type = internal/mpd
host = 127.0.0.1
port = 6600

format-online  = <label-song>
format-paused  = <label-song>
format-stopped =
format-offline =

label-song        = %artist% - %title%
label-song-maxlen = 48

[module/mailbox]
type       = custom/script
exec       = ~/.local/bin/sb-mailbox-polybar
interval   = 180
click-left = st -e neomutt


[module/network]
type           = internal/network
interface      = wlp1s0
interface-type = wireless
interval       = 10

label-connected               = 󰖩 %essid%
label-disconnected            = 󰖪 no wifi
label-disconnected-foreground = ${colors.dim}

[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = AC
full-at       = 99
poll-interval = 60
low-at        = 25

format-charging    = 󰚥 <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full        = <label-full>
format-low         = <ramp-capacity> <label-low>

label-charging    = %percentage%%+
label-discharging = %percentage%%
label-full        = 󰁹 100%
label-low         = %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰂂

[module/volume]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume  = %percentage%%

click-right = st -e pulsemixer
scroll-up   = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

label-muted            = 󰖁 muted
label-muted-foreground = ${colors.dim}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

[module/date]
type     = internal/date
interval = 1
date     = %a %d %b
time     = %H:%M
label    = %date% %time%
