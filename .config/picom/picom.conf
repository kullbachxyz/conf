# ~/.config/picom/picom.conf

backend = "xrender";
vsync = true;

# Shadows
shadow = false;

# Fading / animations
fading = false;

# Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = true;

# Keep dwm frames/borders opaque even when clients set their own opacity.
detect-client-opacity = false;

# Rounded corners
corner-radius = 0;

# Blur
blur-background = false;

# Avoid transparency issues with some windows
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;

# GLX-specific options are intentionally omitted because xrender is used.
