<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Loaded AFTER the system generic aliases (46/66-noto-*.conf, 60-latin.conf …)
       so these prepends actually win. Forces Lato for every non-mono family. -->

  <!-- Generics -->
  <match target="pattern"><test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>

  <!-- Common proportional families requested by name -->
  <match target="pattern"><test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Cantarell</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>DejaVu Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Times</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Georgia</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Open Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Ubuntu</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Verdana</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
  <match target="pattern"><test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lato</string></edit></match>
</fontconfig>
